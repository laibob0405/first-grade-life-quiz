<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小一生活模擬卷</title>
<meta name="description" content="國小一年級生活科線上模擬測驗，題目附注音，作答後自動計分。">
<style>
:root { --ink: #1f2a2e; --paper: #fbf7ee; --card: #fff; --line: #cfc7b5; --main: #1f6f5c; --main-soft: #dff0ea; --good: #1c7c4d; --bad: #b5382d; --bad-soft: #fbe6e3; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: BiauKai, "BiauKaiTC", DFKai-SB, "標楷體", "Noto Serif TC", serif; font-size: 22px; line-height: 1.5; }
main { max-width: 720px; margin: 0 auto; padding: 16px 16px 40px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--main); outline-offset: 2px; }
h1 { font-size: 34px; margin: 28px 0 8px; }
.zy { display: inline-flex; align-items: center; vertical-align: middle; margin-right: .06em; }
.b { display: inline-flex; align-items: center; font-size: .4em; line-height: 1.02; margin-left: .1em; font-weight: 400; }
.s { display: inline-flex; flex-direction: column; align-items: center; }
.s i { font-style: normal; display: block; }
.s .d { line-height: .6; }
.t { margin-left: .05em; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 18px; margin-bottom: 8px; }
.part { font-weight: 700; }
.bar { height: 10px; background: #e8e0cf; border-radius: 5px; overflow: hidden; margin-bottom: 18px; }
.bar div { height: 100%; background: var(--main); transition: width .2s; }
.q { font-size: 26px; margin: 0 0 18px; line-height: 1.7; }
.choices { display: grid; gap: 10px; }
.tf { grid-template-columns: 1fr 1fr; }
.opt { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 64px; padding: 10px 14px; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 10px; }
.tf .opt { justify-content: center; font-size: 44px; min-height: 96px; font-family: Arial, sans-serif; }
.opt[aria-pressed="true"] { border-color: var(--main); background: var(--main-soft); box-shadow: inset 0 0 0 2px var(--main); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.card { position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 6px; padding: 8px; background: var(--card); border: 2px solid var(--line); border-radius: 10px; text-align: left; }
.card svg { width: 100%; height: auto; display: block; }
.card[aria-pressed="true"] { border-color: var(--main); background: var(--main-soft); box-shadow: inset 0 0 0 2px var(--main); }
.card[aria-pressed="true"] svg { background: transparent !important; }
.label { display: flex; align-items: flex-start; gap: 6px; font-size: 20px; }
.box { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: 2px solid var(--ink); border-radius: 4px; background: #fff; font: 700 24px/1 Arial, sans-serif; color: var(--main); }
.ring { position: absolute; inset: 44px 10px 6px; border: 4px solid var(--main); border-radius: 50%; pointer-events: none; }
.yard { position: relative; max-width: 480px; margin: 0 auto; background: #fff; }
.yard svg { width: 100%; height: auto; display: block; }
.mark { position: absolute; display: flex; align-items: center; gap: 2px; padding: 0; background: #fff; border: 0; font: 700 18px/1 Arial, sans-serif; }
.mark .box { width: 26px; height: 26px; font-size: 20px; }
.nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; }
.btn { min-height: 56px; padding: 8px 22px; border-radius: 10px; border: 2px solid var(--main); background: var(--main); color: #fff; font-weight: 700; }
.btn.ghost { background: transparent; color: var(--main); }
.btn[disabled] { visibility: hidden; }
.score { font: 700 84px/1 Arial, sans-serif; color: var(--main); margin: 8px 0 4px; }
.subs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0 26px; }
.sub { background: var(--card); border: 2px solid var(--line); border-radius: 10px; padding: 10px; text-align: center; }
.sub b { display: block; font: 700 26px Arial, sans-serif; }
.wrong { background: var(--card); border: 2px solid var(--line); border-left: 8px solid var(--bad); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
.wrong .a { margin-top: 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.wrong .good { color: var(--good); font-weight: 700; }
.wrong .bad { color: var(--bad); }
.dialog { background: var(--bad-soft); border: 2px solid var(--bad); border-radius: 10px; padding: 14px; margin-top: 18px; }
.dialog .nav { margin-top: 12px; }
@media (max-width: 480px) {
  body { font-size: 20px; }
  .q { font-size: 23px; }
  .label { font-size: 18px; }
  .mark { font-size: 15px; }
  .mark .box { width: 22px; height: 22px; font-size: 17px; }
  .ring { inset: 40px 6px 4px; }
}
</style>
</head>

nts=\"11 -56 25 -36\" fill=\"none\" stroke=\"#111\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"0\" cy=\"-77\" r=\"17\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M-16 -80 A17 17 0 0 1 16 -80 Q4 -88 -16 -80 Z\" fill=\"#333\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"-9\" cy=\"-76\" r=\"2\" fill=\"#111\"/><circle cx=\"3\" cy=\"-76\" r=\"2\" fill=\"#111\"/><path d=\"M-8 -69 Q-3 -64 2 -69\" fill=\"none\" stroke=\"#111\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><g transform=\"translate(330 512) scale(0.7)\"><polyline points=\"-4 -30 -18 -26\" fill=\"none\" stroke=\"#111\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polyline points=\"4 -30 18 -26\" fill=\"none\" stroke=\"#111\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polyline points=\"-11 -56 -19 -36\" fill=\"none\" stroke=\"#111\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M-10 -58 L10 -58 L10 -30 L-10 -30 Z\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><polyline points=\"11 -56 29 -38\" fill=\"none\" stroke=\"#111\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"0\" cy=\"-77\" r=\"17\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M-17 -78 A17 17 0 0 1 17 -78 L12 -85 L6 -82 L0 -86 L-6 -82 L-12 -85 Z\" fill=\"#333\" stroke=\"#111\" stroke-width=\"2\"/><circle cx=\"-3\" cy=\"-76\" r=\"2\" fill=\"#111\"/><circle cx=\"9\" cy=\"-76\" r=\"2\" fill=\"#111\"/><path d=\"M-2 -69 Q3 -64 8 -69\" fill=\"none\" stroke=\"#111\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></g><path d=\"M354 492 H386 q6 -1 6 -10 M389 482 l-4 -7 M392 482 l3 -7\" fill=\"none\" stroke=\"#111\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"368\" cy=\"483\" r=\"9\" fill=\"#fff\" stroke=\"#111\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M368 483 a3 3 0 1 1 3 3 a6 6 0 1 1 -6 -6\" fill=\"none\" stroke=\"#111\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/></svg>"};
const NUM = '①②③④⑤⑥⑦⑧';
const PARTS = [UI.parts0, UI.parts1, UI.parts2];
const app = document.getElementById('app');
let at = 0, answers = [], confirming = false;

function reset() {
  answers = QUESTIONS.map(q => (q.type === 'multi' ? q.items.map(() => false) : null));
  at = 0; confirming = false;
}
const isBlank = a => a === null || (Array.isArray(a) && !a.includes(true));
const pressed = on => 'aria-pressed="' + on + '"';

function start() {
  app.innerHTML = '<h1>' + UI.title + '</h1><p>' + UI.intro + '</p><div class="nav"><span></span><button class="btn" id="go">' + UI.start + '</button></div>';
  document.getElementById('go').onclick = () => { reset(); question(); };
}

function body(q, a) {
  if (q.type === 'tf') return '<div class="choices tf">' + [['O', '○'], ['X', '✕']].map(([v, s]) => '<button class="opt" data-v="' + v + '" ' + pressed(a === v) + '>' + s + '</button>').join('') + '</div>';
  if (q.type === 'mc') return '<div class="choices">' + q.options.map((o, i) => '<button class="opt" data-v="' + i + '" ' + pressed(a === i) + '><span>' + NUM[i] + '</span><span>' + o + '</span></button>').join('') + '</div>';
  if (q.mode === 'yard') return '<div class="yard">' + YARD.svg + YARD.labels.map((p, i) => '<button class="mark" data-v="' + i + '" ' + pressed(a[i]) + ' aria-label="' + (i + 1) + '" style="left:' + p.left + '%;top:' + p.top + '%"><span class="box">' + (a[i] ? 'V' : '') + '</span>' + NUM[i] + '</button>').join('') + '</div>';
  return '<div class="grid">' + q.items.map((it, i) => '<button class="card" data-v="' + i + '" ' + pressed(a[i]) + '><span class="label">' + (q.mode === 'tick' ? '<span class="box">' + (a[i] ? 'V' : '') + '</span>' : '') + '<span>' + NUM[i] + '</span><span>' + it.label + '</span></span>' + it.svg + (q.mode === 'circle' && a[i] ? '<span class="ring"></span>' : '') + '</button>').join('') + '</div>';
}

function question() {
  const q = QUESTIONS[at], last = at === QUESTIONS.length - 1;
  app.innerHTML = '<div class="top"><span class="part">' + PARTS[q.part] + '</span><span>' + (at + 1) + ' / ' + QUESTIONS.length + '</span></div>' +
    '<div class="bar"><div style="width:' + ((at + 1) / QUESTIONS.length) * 100 + '%"></div></div>' +
    '<p class="q">' + q.q + '</p>' + body(q, answers[at]) +
    (confirming ? '<div class="dialog">' + UI.unanswered + '<div class="nav"><button class="btn ghost" id="back">' + UI.goback + '</button><button class="btn" id="send">' + UI.submit + '</button></div></div>' :
      '<div class="nav"><button class="btn ghost" id="prev" ' + (at ? '' : 'disabled') + '>' + UI.prev + '</button><button class="btn" id="next">' + (last ? UI.finish : UI.next) + '</button></div>');
  app.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
    const v = b.dataset.v;
    if (q.type === 'tf') answers[at] = v;
    else if (q.type === 'mc') answers[at] = Number(v);
    else answers[at][v] = !answers[at][v];
    question();
  });
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on('prev', () => { at--; question(); scrollTo(0, 0); });
  on('next', () => {
    if (!last) { at++; question(); scrollTo(0, 0); return; }
    if (answers.some(isBlank)) { confirming = true; question(); return; }
    result();
  });
  on('back', () => { confirming = false; at = answers.findIndex(isBlank); question(); scrollTo(0, 0); });
  on('send', result);
}

// True/false and multiple choice are worth 2 each; every picture item is worth 2, but a picture question left untouched scores 0.
function points(q, a) {
  if (q.type === 'tf' || q.type === 'mc') return a === q.answer ? 2 : 0;
  if (isBlank(a)) return 0;
  return q.items.reduce((s, it, i) => s + (a[i] === it.ok ? 2 : 0), 0);
}
function max(q) { return q.type === 'multi' ? q.items.length * 2 : 2; }

function shown(q, a) {
  if (q.type === 'tf') return a === null ? UI.none : a === 'O' ? '○' : '✕';
  if (q.type === 'mc') return a === null ? UI.none : NUM[a] + q.options[a];
  const list = q.items.map((it, i) => (a[i] ? NUM[i] + it.label : '')).filter(Boolean);
  return list.length ? list.join('　') : UI.none;
}
function right(q) {
  if (q.type === 'tf') return q.answer === 'O' ? '○' : '✕';
  if (q.type === 'mc') return NUM[q.answer] + q.options[q.answer];
  return q.items.map((it, i) => (it.ok ? NUM[i] + it.label : '')).filter(Boolean).join('　');
}

function result() {
  const total = QUESTIONS.reduce((s, q, i) => s + points(q, answers[i]), 0);
  const subs = [0, 1, 2].map(p => {
    const list = QUESTIONS.map((q, i) => [q, i]).filter(([q]) => q.part === p);
    return '<div class="sub">' + PARTS[p] + '<b>' + list.reduce((s, [q, i]) => s + points(q, answers[i]), 0) + ' / ' + list.reduce((s, [q]) => s + max(q), 0) + '</b></div>';
  }).join('');
  const wrong = QUESTIONS.map((q, i) => [q, i]).filter(([q, i]) => points(q, answers[i]) < max(q));
  app.innerHTML = '<h1>' + UI.score + '</h1><div class="score" id="total">' + total + '</div><div class="subs">' + subs + '</div>' +
    (wrong.length ? '<h2>' + UI.review + '</h2>' + wrong.map(([q, i]) => '<div class="wrong"><div>' + q.q + '</div><div class="a bad">' + UI.yours + '：' + shown(q, answers[i]) + '</div><div class="a good">' + UI.correct + '：' + right(q) + '</div></div>').join('') : '<p>' + UI.right + '</p>') +
    '<div class="nav"><span></span><button class="btn" id="again">' + UI.again + '</button></div>';
  document.getElementById('again').onclick = () => { reset(); question(); scrollTo(0, 0); };
  scrollTo(0, 0);
}

start();
</script>
</body>
